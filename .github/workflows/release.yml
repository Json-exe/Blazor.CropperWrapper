name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'V[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: ^12.0.0
          runtime: node@22
          cache: true

      - name: Install JS dependencies
        run: pnpm --dir Blazor.Cropper install --frozen-lockfile

      - name: Build JS bundle
        run: pnpm --dir Blazor.Cropper run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Build solution (Release)
        run: dotnet build Json_exe.Blazor.CropperWrapper.sln -c Release --nologo

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: Blazor.Cropper/bin/Release/*.nupkg
          if-no-files-found: error
